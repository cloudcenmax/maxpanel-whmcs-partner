name: Module checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fulfillment:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '7.2'
            database: '^6.20'
            composer: 'v2.2'
          - php: '7.3'
            database: '^6.20'
            composer: 'v2.2'
          - php: '7.4'
            database: '^8.83'
            composer: 'v2'
          - php: '8.1'
            database: '^10.48'
            composer: 'v2'
          - php: '8.2'
            database: '^12.0'
            composer: 'v2'
          - php: '8.3'
            database: '^12.0'
            composer: 'v2'
          - php: '8.4'
            database: '^12.0'
            composer: 'v2'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, pdo_sqlite, mbstring
          tools: composer:${{ matrix.composer }}
          coverage: none
      - run: composer require --dev "illuminate/database:${{ matrix.database }}" --no-interaction --no-progress
      - run: find modules tests -name '*.php' -exec php -l {} \;
      - run: composer test

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify Gitleaks
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks"
          cd "$RUNNER_TEMP/gitleaks"
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          grep ' gitleaks_8.30.1_linux_x64.tar.gz$' gitleaks_8.30.1_checksums.txt | sha256sum -c -
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
      - name: Scan public source
        run: '"$RUNNER_TEMP/gitleaks/gitleaks" dir . --redact --no-banner'
